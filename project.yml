name: MRRadar
options:
  bundleIdPrefix: com.jastech
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  RadarKit:
    path: RadarKit

targets:
  MRRadar:
    type: application
    platform: macOS
    sources:
      - path: MRRadar
    dependencies:
      - package: RadarKit
      - target: mrradar-cli
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: MRRadar
        PRODUCT_BUNDLE_IDENTIFIER: com.jastech.mrradar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MRRadar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Arda Sentürk"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
        Release:
          DEVELOPMENT_TEAM: 5JMD3VSD7N
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: --timestamp
  mrradar-cli:
    type: tool
    platform: macOS
    sources:
      - path: RadarKit/Sources/mrradar
    dependencies:
      - package: RadarKit
    settings:
      base:
        PRODUCT_NAME: mrradar-hub
        PRODUCT_BUNDLE_IDENTIFIER: com.jastech.mrradar.cli
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
        Release:
          DEVELOPMENT_TEAM: 5JMD3VSD7N
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: --timestamp
